version = 1

[[annotations]]
path = "firmware/**"
SPDX-FileCopyrightText = "2026 the OpenPinMarker contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "hardware/**"
SPDX-FileCopyrightText = "2026 the OpenPinMarker contributors"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

[[annotations]]
path = ["README.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md", "REUSE.toml", ".gitignore", ".github/**", "docs/**"]
SPDX-FileCopyrightText = "2026 the OpenPinMarker contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Drawings made from the CAD (renders, wiring, schematics) are hardware
# source, and CC-BY-SA-4.0 does not combine with CERN-OHL-S. They go into
# docs/drawings/. Last, because the last matching table wins.
[[annotations]]
path = "docs/drawings/**"
SPDX-FileCopyrightText = "2026 the OpenPinMarker contributors"
SPDX-License-Identifier = "CERN-OHL-S-2.0"
